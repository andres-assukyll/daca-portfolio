<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="520"
     viewBox="71 0 720 520"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Klientide käibenäitajate võrdlus</title>

  <desc id="desc">
    Kaks kolme horisontaalse tulbaga võrdlust.
    Kogukäive on 2 909 177.98 eurot, klientide kogukäive
    2 622 731.78 eurot ja VIP kogukäive 346 313.28 eurot.
    Klientide keskmine käive on 1 028.12 eurot,
    keskmine käive 1 139.96 eurot ja keskmine VIP käive
    18 227.01 eurot.
    Kogusummad ja keskmised kasutavad eraldi skaalasid.
  </desc>

  <!-- Taust -->
  <rect x="71" y="0" width="720" height="520" fill="#F7F1E6"/>

  <!-- Pealkiri -->
  <text x="98" y="48"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25"
        font-weight="700"
        fill="#2F302B">
    Klientide käibenäitajate võrdlus
  </text>

  <!-- Kogukäive -->
  <text x="98" y="90"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KOGUKÄIVE
  </text>

  <g stroke="#D6D0C5" stroke-width="1">
    <line x1="250" y1="106" x2="250" y2="226"/>
    <line x1="393.3" y1="106" x2="393.3" y2="226"/>
    <line x1="537.7" y1="106" x2="537.7" y2="226"/>
    <line x1="681" y1="106" x2="681" y2="226"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">
    <text x="98" y="127">Kogukäive</text>
    <text x="98" y="167">Klientide kogukäive</text>
    <text x="98" y="207">VIP kogukäive</text>
  </g>

  <rect x="250" y="110" width="418.07" height="24" fill="#CC6E50"/>
  <rect x="250" y="150" width="377.13" height="24" fill="#5E7361"/>
  <rect x="250" y="190" width="49.57" height="24" fill="#8FA58F"/>

  <!-- Summad algavad lõppjoonest 10 px kaugusel.
       Pikimad summad lõpevad x=764: paremale jääb 27 px. -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">
    <text x="691" y="127"
          textLength="73"
          lengthAdjust="spacingAndGlyphs">2 909 177.98 €</text>
    <text x="691" y="167"
          textLength="73"
          lengthAdjust="spacingAndGlyphs">2 622 731.78 €</text>
    <text x="691" y="207">346 313.28 €</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361"
     text-anchor="middle">
    <text x="250" y="241">0</text>
    <text x="393.3" y="241">1 mln</text>
    <text x="537.7" y="241">2 mln</text>
    <text x="681" y="241">3 mln €</text>
  </g>

  <!-- Keskmine käive -->
  <text x="98" y="290"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KESKMINE KÄIVE
  </text>

  <g stroke="#D6D0C5" stroke-width="1">
    <line x1="250" y1="306" x2="250" y2="426"/>
    <line x1="357.75" y1="306" x2="357.75" y2="426"/>
    <line x1="465.5" y1="306" x2="465.5" y2="426"/>
    <line x1="573.25" y1="306" x2="573.25" y2="426"/>
    <line x1="681" y1="306" x2="681" y2="426"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">
    <!-- Tekst lõpeb x=240: nulljooneni jääb 10 px. -->
    <text x="98" y="327"
          textLength="142"
          lengthAdjust="spacingAndGlyphs">Klientide keskmine käive</text>
    <text x="98" y="367">Keskmine käive</text>
    <text x="98" y="407">Keskmine VIP käive</text>
  </g>

  <rect x="250" y="310" width="22.63" height="24" fill="#B5C5B5"/>
  <rect x="250" y="350" width="24.78" height="24" fill="#8FA58F"/>
  <rect x="250" y="390" width="393.29" height="24" fill="#D98F77"/>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">
    <text x="691" y="327">1 028.12 €</text>
    <text x="691" y="367">1 139.96 €</text>
    <text x="691" y="407">18 227.01 €</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361"
     text-anchor="middle">
    <text x="250" y="441">0</text>
    <text x="357.75" y="441">5 000</text>
    <text x="465.5" y="441">10 000</text>
    <text x="573.25" y="441">15 000</text>
    <text x="681" y="441">20 000 €</text>
  </g>

  <text x="764" y="490"
        text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10"
        fill="#5E7361">
    Kogusummad ja keskmised on eri skaaladel
  </text>

</svg>
