<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="520"
     viewBox="71 0 720 520"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Klientide käibenäitajate võrdlus</title>

  <desc id="desc">
    Kaks kolme horisontaalse tulbaga võrdlust.
    Kogukäive on 2 909 177.98 eurot, klientide kogukäive 2 622 731.78 eurot
    ja VIP kogukäive 346 313.28 eurot.
    Klientide keskmine käive on 1 028.12 eurot, keskmine käive 1 139.96 eurot
    ja keskmine VIP käive 18 227.01 eurot.
    Kogusummad ja keskmised kasutavad eraldi skaalasid.
  </desc>

  <rect x="71" y="0" width="720" height="520" fill="#F7F1E6"/>

  <text x="98" y="48"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25"
        font-weight="700"
        fill="#2F302B">
    Klientide käibenäitajate võrdlus
  </text>

  <!-- Kogukäive -->
  <text x="98" y="90"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KOGUKÄIVE
  </text>

  <g stroke="#D6D0C5" stroke-width="1">
    <line x1="250" y1="106" x2="250" y2="226"/>
    <line x1="383" y1="106" x2="383" y2="226"/>
    <line x1="517" y1="106" x2="517" y2="226"/>
    <line x1="650" y1="106" x2="650" y2="226"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">
    <text x="98" y="127">Kogukäive</text>
    <text x="98" y="167">Klientide kogukäive</text>
    <text x="98" y="207">VIP kogukäive</text>
  </g>

  <rect x="250" y="110" width="388" height="24" fill="#CC6E50"/>
  <rect x="250" y="150" width="350" height="24" fill="#5E7361"/>
  <rect x="250" y="190" width="46" height="24" fill="#8FA58F"/>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">
    <text x="660" y="127">2 909 177.98 €</text>
    <text x="660" y="167">2 622 731.78 €</text>
    <text x="660" y="207">346 313.28 €</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361">
    <text x="250" y="241" text-anchor="middle">0</text>
    <text x="383" y="241" text-anchor="middle">1 mln</text>
    <text x="517" y="241" text-anchor="middle">2 mln</text>
    <text x="650" y="241" text-anchor="middle">3 mln €</text>
  </g>

  <!-- Keskmine käive -->
  <text x="98" y="290"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KESKMINE KÄIVE
  </text>

  <g stroke="#D6D0C5" stroke-width="1">
    <line x1="250" y1="306" x2="250" y2="426"/>
    <line x1="350" y1="306" x2="350" y2="426"/>
    <line x1="450" y1="306" x2="450" y2="426"/>
    <line x1="550" y1="306" x2="550" y2="426"/>
    <line x1="650" y1="306" x2="650" y2="426"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">
    <text x="98" y="327">Klientide keskmine käive</text>
    <text x="98" y="367">Keskmine käive</text>
    <text x="98" y="407">Keskmine VIP käive</text>
  </g>

  <rect x="250" y="310" width="21" height="24" fill="#B5C5B5"/>
  <rect x="250" y="350" width="23" height="24" fill="#8FA58F"/>
  <rect x="250" y="390" width="365" height="24" fill="#D98F77"/>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">
    <text x="660" y="327">1 028.12 €</text>
    <text x="660" y="367">1 139.96 €</text>
    <text x="660" y="407">18 227.01 €</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361">
    <text x="250" y="441" text-anchor="middle">0</text>
    <text x="350" y="441" text-anchor="middle">5 000</text>
    <text x="450" y="441" text-anchor="middle">10 000</text>
    <text x="550" y="441" text-anchor="middle">15 000</text>
    <text x="650" y="441" text-anchor="middle">20 000 €</text>
  </g>

  <text x="733" y="490"
        text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10"
        fill="#5E7361">
    Kogusummad ja keskmised on eri skaaladel
  </text>

</svg>
