<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="420"
     viewBox="0 0 720 420"
     role="img"
     aria-labelledby="title desc">

  <title id="title">
    VIP kliendid linnade kaupa
  </title>

  <desc id="desc">
    Tabel: Tallinn 8, Pärnu 6, Tartu 2, Jõhvi 1, Rakvere 1 ja Viljandi 1 VIP klienti.
  </desc>

  <!-- Taust -->
  <rect width="720"
        height="420"
        fill="#F7F1E6"/>

  <!-- Pealkiri -->
  <text x="36"
        y="48"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25"
        font-weight="700"
        fill="#2F302B">
    VIP kliendid linnade kaupa
  </text>

  <!-- Päis -->
  <rect x="36"
        y="72"
        width="648"
        height="44"
        rx="2"
        fill="#5E7361"/>

  <!-- Andmeread -->
  <rect x="36" y="116" width="648" height="44" fill="#D68669"/>
  <rect x="36" y="160" width="648" height="44" fill="#E0A18B"/>
  <rect x="36" y="204" width="648" height="44" fill="#F1D2C6"/>
  <rect x="36" y="248" width="648" height="44" fill="#F9EBE4"/>
  <rect x="36" y="292" width="648" height="44" fill="#F9EBE4"/>
  <rect x="36" y="336" width="648" height="44" rx="2" fill="#F9EBE4"/>

  <!-- Eraldusjooned -->
  <g stroke="#D6D0C5"
     stroke-width="1">
    <line x1="36" y1="160" x2="684" y2="160"/>
    <line x1="36" y1="204" x2="684" y2="204"/>
    <line x1="36" y1="248" x2="684" y2="248"/>
    <line x1="36" y1="292" x2="684" y2="292"/>
    <line x1="36" y1="336" x2="684" y2="336"/>
  </g>

  <!-- Tabeli tekst -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="16">

    <!-- Päise tekst -->
    <g font-weight="700"
       fill="#F7F1E6">

      <text x="56" y="100">
        Linn
      </text>

      <text x="660"
            y="100"
            text-anchor="end">
        VIP klientide arv
      </text>

    </g>

    <!-- Andmeridade tekst -->
    <g fill="#2F302B">

      <text x="56"
            y="144"
            font-weight="700">
        Tallinn
      </text>

      <text x="660"
            y="144"
            text-anchor="end"
            font-weight="700">
        8
      </text>

      <text x="56"
            y="188"
            font-weight="700">
        Pärnu
      </text>

      <text x="660"
            y="188"
            text-anchor="end"
            font-weight="700">
        6
      </text>

      <text x="56" y="232">
        Tartu
      </text>

      <text x="660"
            y="232"
            text-anchor="end">
        2
      </text>

      <text x="56" y="276">
        Jõhvi
      </text>

      <text x="660"
            y="276"
            text-anchor="end">
        1
      </text>

      <text x="56" y="320">
        Rakvere
      </text>

      <text x="660"
            y="320"
            text-anchor="end">
        1
      </text>

      <text x="56" y="364">
        Viljandi
      </text>

      <text x="660"
            y="364"
            text-anchor="end">
        1
      </text>

    </g>
  </g>

</svg>
