<svg xmlns="http://www.w3.org/2000/svg"
     width="689"
     height="450"
     viewBox="71 0 689 450"
     role="img"
     aria-labelledby="title desc">

  <title id="title">
    Klientide müük moodustab 90% kogukäibest
  </title>

  <desc id="desc">
    Nelja horisontaalse tulbaga võrdlus. Kogukäive on
    2 909 177.98 eurot, klientide kogukäive 2 622 731.78 eurot,
    klientide keskmine käive 1 028.12 eurot ja keskmine käive
    1 139.96 eurot. Kogusummad ja keskmised kasutavad eraldi skaalasid.
  </desc>

  <!-- Taust -->
  <rect x="71"
        y="0"
        width="689"
        height="450"
        fill="#F7F1E6"/>

  <!-- Üldpealkiri -->
  <text x="98"
        y="48"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25"
        font-weight="700"
        fill="#2F302B">
    Klientide müük moodustab 90% kogukäibest
  </text>

  <!-- Kogukäibe ploki pealkiri -->
  <text x="98"
        y="90"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KOGUKÄIVE
  </text>

  <!-- Kogukäibe skaala -->
  <g stroke="#D6D0C5"
     stroke-width="1">
    <line x1="250" y1="106" x2="250" y2="204"/>
    <line x1="383" y1="106" x2="383" y2="204"/>
    <line x1="517" y1="106" x2="517" y2="204"/>
    <line x1="650" y1="106" x2="650" y2="204"/>
  </g>

  <!-- Kogukäibe tulbanimed -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">

    <text x="98" y="133">
      Kogukäive
    </text>

    <text x="98" y="181">
      Klientide kogukäive
    </text>

  </g>

  <!-- Kogukäive: terrakota -->
  <rect x="250"
        y="114"
        width="388"
        height="24"
        fill="#CC6E50"/>

  <!-- Klientide kogukäive: tume salvei -->
  <rect x="250"
        y="162"
        width="350"
        height="24"
        fill="#5E7361"/>

  <!-- Kogukäibe väärtused -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">

    <text x="660" y="132">
      2 909 177.98 €
    </text>

    <text x="660" y="180">
      2 622 731.78 €
    </text>

  </g>

  <!-- Kogukäibe telje tähised -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361">

    <text x="250"
          y="218"
          text-anchor="middle">
      0
    </text>

    <text x="383"
          y="218"
          text-anchor="middle">
      1 mln
    </text>

    <text x="517"
          y="218"
          text-anchor="middle">
      2 mln
    </text>

    <text x="650"
          y="218"
          text-anchor="middle">
      3 mln €
    </text>

  </g>

  <!-- Keskmise käibe ploki pealkiri -->
  <text x="98"
        y="270"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        font-weight="700"
        fill="#5E7361">
    KESKMINE KÄIVE
  </text>

  <!-- Keskmise käibe skaala -->
  <g stroke="#D6D0C5"
     stroke-width="1">
    <line x1="250" y1="286" x2="250" y2="384"/>
    <line x1="383" y1="286" x2="383" y2="384"/>
    <line x1="517" y1="286" x2="517" y2="384"/>
    <line x1="650" y1="286" x2="650" y2="384"/>
  </g>

  <!-- Keskmise käibe tulbanimed -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="#2F302B"
     text-anchor="start">

    <text x="98" y="313">
      Klientide keskmine käive
    </text>

    <text x="98" y="361">
      Keskmine käive
    </text>

  </g>

  <!-- Klientide keskmine käive: hele salvei -->
  <rect x="250"
        y="294"
        width="343"
        height="24"
        fill="#8FA58F"/>

  <!-- Keskmine käive: hele terrakota -->
  <rect x="250"
        y="342"
        width="380"
        height="24"
        fill="#D98F77"/>

  <!-- Keskmise käibe väärtused -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="11"
     font-weight="700"
     fill="#2F302B"
     text-anchor="start">

    <text x="660" y="312">
      1 028.12 €
    </text>

    <text x="660" y="360">
      1 139.96 €
    </text>

  </g>

  <!-- Keskmise käibe telje tähised -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="10"
     fill="#5E7361">

    <text x="250"
          y="398"
          text-anchor="middle">
      0
    </text>

    <text x="383"
          y="398"
          text-anchor="middle">
      400
    </text>

    <text x="517"
          y="398"
          text-anchor="middle">
      800
    </text>

    <text x="650"
          y="398"
          text-anchor="middle">
      1 200 €
    </text>

  </g>

  <!-- Skaalade selgitus -->
  <text x="733"
        y="426"
        text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10"
        fill="#5E7361">
    Kogusummad ja keskmised on eri skaaladel
  </text>

</svg>
